<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deploy ArcStream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --paper:#F3F6FA; --surface:#FFFFFF; --ink:#0F1D2E; --muted:#5B6B7F; --line:#D9E1EA;
      --usdc:#2775CA; --usdc-ink:#FFFFFF; --flow:#138A63; --flow-soft:#E1F3EC;
      --danger:#B4382F; --danger-soft:#F8E5E3; --warn:#8A5A00; --warn-soft:#FBF1DA;
      --font:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper:#0C1520; --surface:#132131; --ink:#E7EEF6; --muted:#8D9BAD; --line:#22344A;
        --usdc:#5B9DE8; --usdc-ink:#06111E; --flow:#3CC596; --flow-soft:#133628;
        --danger:#E5766C; --danger-soft:#3A1C1A; --warn:#F0C66A; --warn-soft:#3A2E12;
      }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--paper); color:var(--ink); font-family:var(--font); line-height:1.5; }
    .wrap { max-width:600px; margin:0 auto; padding:40px 20px 80px; }
    h1 { font-size:1.8rem; letter-spacing:-0.02em; }
    p.sub { color:var(--muted); margin-top:6px; }
    .sheet { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; margin-top:24px; }
    h2 { font-size:1rem; margin-bottom:10px; }
    .netswitch { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:3px; }
    .netswitch button { border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600; font-size:.9rem; padding:6px 16px; border-radius:999px; cursor:pointer; }
    .netswitch button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
    .facts { margin-top:14px; display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:.92rem; }
    .facts dt { color:var(--muted); }
    .facts dd { font-variant-numeric:tabular-nums; word-break:break-all; }
    .btn { width:100%; margin-top:20px; border:0; border-radius:10px; background:var(--usdc); color:var(--usdc-ink); font:inherit; font-weight:700; padding:14px; cursor:pointer; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .status { margin-top:16px; border-radius:10px; padding:12px 16px; font-size:.92rem; display:none; word-break:break-all; }
    .status.show { display:block; }
    .status.info { background:var(--paper); }
    .status.ok { background:var(--flow-soft); color:var(--ink); }
    .status.err { background:var(--danger-soft); color:var(--danger); }
    .status.warn { background:var(--warn-soft); color:var(--warn); }
    .status a { color:var(--usdc); font-weight:600; }
    code { font-family: ui-monospace, Consolas, monospace; font-size:.88em; background:var(--paper); padding:2px 6px; border-radius:5px; }
    .copy { margin-top:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-size:.88rem; font-weight:600; padding:6px 12px; border-radius:8px; cursor:pointer; }
    :focus-visible { outline:2px solid var(--usdc); outline-offset:2px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Deploy ArcStream</h1>
  <p class="sub">Deploys the ArcStream contract from your wallet. Do Testnet first, then Mainnet.</p>

  <div class="sheet">
    <h2>Network</h2>
    <div class="netswitch" role="group" aria-label="Network">
      <button type="button" data-net="arcTestnet" aria-pressed="true">Arc Testnet</button>
      <button type="button" data-net="arc" aria-pressed="false">Arc Mainnet</button>
    </div>
    <dl class="facts">
      <dt>Chain ID</dt><dd id="fChain">—</dd>
      <dt>Wallet</dt><dd id="fWallet">not connected</dd>
      <dt>Wallet network</dt><dd id="fWalletNet">—</dd>
      <dt>Balance</dt><dd id="fBalance">—</dd>
      <dt>Compiler</dt><dd>solc 0.8.28, optimizer 200 runs, EVM cancun</dd>
      <dt>Bytecode hash</dt><dd id="fHash">—</dd>
    </dl>
    <button class="btn" id="btnDeploy" type="button">Connect wallet</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
// ArcStream creation bytecode — compiled from contracts/ArcStream.sol

600190565b634e487b7160e01b5f52601160045260245ffd5b80820180821115610cf257610cf2610f75565b5f60018201610fad57610fad610f75565b5060010190565b5f82610fce57634e487b7160e01b5f52601260045260245ffd5b500490565b8082028115828204841417610cf257610cf2610f75565b81810381811115610cf257610cf2610f7556fea264697066735822122023736a6e7a1350b6c70f328cff11b6f15e47d6d4db5999ec3a632f0981aef48564736f6c634300081c0033";

const NETWORKS = {
  arcTestnet: {
    key: "arcTestnet", chainId: 5042002, chainName: "Arc Testnet",
    rpcUrls: ["https://rpc.testnet.arc.io"], explorer: "https://explorer.testnet.arc.io",
    faucet: "https://faucet.circle.com"
  },
  arc: {
    key: "arc", chainId: 5042, chainName: "Arc",
    rpcUrls: ["https://rpc.mainnet.arc.io"], explorer: "https://explorer.arc.io"
  }
};
const MIN_FEE = ethers.utils.parseUnits("20", "gwei");
const PRIORITY_FEE = ethers.utils.parseUnits("1", "gwei");

const eth = window.ethereum || window.okxwallet || null;
let target = NETWORKS.arcTestnet;
let provider = null, signer = null, address = null, walletChainId = null;
const $ = id => document.getElementById(id);
const hexId = n => "0x" + n.toString(16);

function setStatus(kind, html) { const el = $("status"); el.className = "status show " + kind; el.innerHTML = html; }
function clearStatus() { $("status").className = "status"; }

function errMsg(e) {
  if (!e) return "unknown error";
  if (e.code === 4001 || e.code === "ACTION_REJECTED") return "You rejected the request in your wallet.";
  const m = e.reason || e.error?.data?.message || e.error?.message || e.data?.message || e.message || "unknown error";
  return String(m).slice(0, 200);
}

async function refresh() {
  document.querySelectorAll("[data-net]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.net === target.key)));
  $("fChain").textContent = `${target.chainId} (${hexId(target.chainId)})`;
  $("fHash").textContent = ethers.utils.keccak256(BYTECODE).slice(0, 18) + "…";
  const btn = $("btnDeploy");

  if (!eth) {
    btn.disabled = true; btn.textContent = "No wallet found";
    setStatus("err", "Install MetaMask, Rabby or OKX Wallet, then reload this page.");
    return;
  }
  if (!address) { btn.disabled = false; btn.textContent = "Connect wallet"; return; }

  $("fWallet").textContent = address;
  walletChainId = (await provider.getNetwork()).chainId;
  $("fWalletNet").textContent = walletChainId === target.chainId ? `${target.chainName} ✓` : `chain ${walletChainId}`;

  if (walletChainId !== target.chainId) {
    $("fBalance").textContent = "—";
    btn.disabled = false; btn.textContent = `Switch wallet to ${target.chainName}`;
    return;
  }
  const bal = await provider.getBalance(address);
  $("fBalance").textContent = `${ethers.utils.formatEther(bal)} USDC`;
  if (bal.isZero()) {
    btn.disabled = true; btn.textContent = "No USDC for gas";
    setStatus("warn", target.faucet
      ? `This wallet has no USDC on ${target.chainName}. Get test USDC at <a href="${target.faucet}" target="_blank" rel="noopener">faucet.circle.com</a>, then reload.`
      : `This wallet has no USDC on ${target.chainName}. Bridge a few USDC to Arc for gas, then reload.`);
    return;
  }
  btn.disabled = false; btn.textContent = `Deploy to ${target.chainName}`;
}

async function connect() {
  provider = new ethers.providers.Web3Provider(eth, "any");
  await provider.send("eth_requestAccounts", []);
  signer = provider.getSigner();
  address = await signer.getAddress();
}

async function switchWallet() {
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hexId(target.chainId) }] });
  } catch (e) {
    const unknown = e && (e.code === 4902 || e.data?.originalError?.code === 4902 || /unrecognized chain|not been added|unknown chain/i.test(e.message || ""));
    if (!unknown) throw e;
    await eth.request({ method: "wallet_addEthereumChain", params: [{
      chainId: hexId(target.chainId), chainName: target.chainName,
      nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
      rpcUrls: target.rpcUrls, blockExplorerUrls: [target.explorer]
    }]});
  }
}

async function feeOverrides() {
  const block = await provider.getBlock("latest");
  const base = block && block.baseFeePerGas ? block.baseFeePerGas : MIN_FEE;
  let maxFee = base.mul(2).add(PRIORITY_FEE);
  const floor = MIN_FEE.add(PRIORITY_FEE);
  if (maxFee.lt(floor)) maxFee = floor;
  return { maxFeePerGas: maxFee, maxPriorityFeePerGas: PRIORITY_FEE };
}

async function onButton() {
  const btn = $("btnDeploy");
  clearStatus();
  try {
    if (!address) { await connect(); return refresh(); }
    if (walletChainId !== target.chainId) { await switchWallet(); return; } // chainChanged → reload

    if (target.key === "arc" && !confirm("Deploy ArcStream to Arc Mainnet? This costs real USDC for gas.")) return;

    btn.disabled = true; btn.textContent = "Confirm in your wallet…";
    const factory = new ethers.ContractFactory([], BYTECODE, signer);
    const contract = await factory.deploy(await feeOverrides());
    const txUrl = `${target.explorer}/tx/${contract.deployTransaction.hash}`;
    btn.textContent = "Deploying…";
    setStatus("info", `Transaction sent. <a href="${txUrl}" target="_blank" rel="noopener">View transaction</a>`);
    await contract.deployed();

    const addrUrl = `${target.explorer}/address/${contract.address}`;
    setStatus("ok", `ArcStream is live on ${target.chainName}.<br><br>
      Address: <b>${contract.address}</b><br>
      <a href="${addrUrl}" target="_blank" rel="noopener">Open in explorer</a> · <a href="${txUrl}" target="_blank" rel="noopener">Deploy transaction</a><br><br>
      Paste this address in <code>index.html</code> as <code>NETWORKS.${target.key}.contract</code>.<br>
      <button class="copy" type="button" id="btnCopy">Copy address</button>`);
    $("btnCopy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(contract.address); $("btnCopy").textContent = "Copied"; } catch {}
    });
    btn.textContent = "Deployed";
  } catch (e) {
    console.error(e);
    setStatus("err", "Deploy failed: " + errMsg(e));
    btn.disabled = false;
    await refresh();
  }
}

document.querySelectorAll("[data-net]").forEach(b => b.addEventListener("click", () => {
  target = NETWORKS[b.dataset.net]; clearStatus(); refresh();
}));
$("btnDeploy").addEventListener("click", onButton);

if (eth && eth.on) {
  eth.on("chainChanged", () => location.reload());
  eth.on("accountsChanged", () => location.reload());
}

window.addEventListener("DOMContentLoaded", async () => {
  try {
    const saved = sessionStorage.getItem("arcstream.deploy.net");
    if (saved && NETWORKS[saved]) target = NETWORKS[saved];
  } catch {}
  document.querySelectorAll("[data-net]").forEach(b => b.addEventListener("click", () => {
    try { sessionStorage.setItem("arcstream.deploy.net", b.dataset.net); } catch {}
  }));
  if (eth) {
    try {
      const acc = await eth.request({ method: "eth_accounts" });
      if (acc.length) {
        provider = new ethers.providers.Web3Provider(eth, "any");
        signer = provider.getSigner();
        address = await signer.getAddress();
      }
    } catch {}
  }
  refresh();
});
